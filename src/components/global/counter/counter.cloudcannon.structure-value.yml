    type: text
    hidden: true
    instance_value: UUID
  description:
    type: markdown
  alternate_style:
    type: switch
  numbers:
    type: array
    options:
      structures: _structures.counter_stat

_structures:
  counter_stat:
    values:
      - value:
          _uuid:
          prefix:
          number:
          suffix:
          text:
        _inputs:
          _uuid:
            type: text
            hidden: true
            instance_value: UUID
          number:
            type: text
            options:
              pattern: '^\d+$'
              pattern_message: Value must be only numbers.
        preview:
          icon: numbers
          text:
            - template: '{prefix} {number} {suffix}'
            - Counter Statistic
          subtext:
            - key: text
          
preview:
  subtext:
    - template: '{title} {title_suffix}'